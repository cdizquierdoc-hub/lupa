<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LUPA</title>
<meta name="description" content="Localizador Unificado de Precios y Alternativas">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Una columna para teléfono, pestañas fijas abajo; los precios van en "preciador" amarillo */
:root{
  --paper:#EEF1F5; --card:#FFFFFF; --ink:#111827; --muted:#5A6476; --line:#D8DEE7;
  --tag:#FFD000; --tag-ink:#111111; --brand:#1E3BB8; --brand-ink:#FFFFFF;
  --good:#0B7F45; --good-bg:#E3F5EA; --bad:#C0262D; --bad-bg:#FCE6E7; --warn:#9A5B00; --warn-bg:#FFF1D6;
  --shadow:0 1px 2px rgba(17,24,39,.06),0 4px 14px rgba(17,24,39,.06);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0C1016; --card:#151B25; --ink:#E9EDF3; --muted:#9AA4B5; --line:#273142;
  --brand:#7D98FF; --brand-ink:#0C1016;
  --good:#46CF85; --good-bg:#12301F; --bad:#FF7479; --bad-bg:#3A1619; --warn:#F5B547; --warn-bg:#33260D;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:0;z-index:5;background:#111827;color:#EEF1F5;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1;text-transform:uppercase}
.logo b{background:var(--tag);color:var(--tag-ink);padding:1px 6px 0;margin-left:4px;border-radius:3px}
.top .who{margin-left:auto;font-size:13px;opacity:.8;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.net{width:9px;height:9px;border-radius:50%;background:#46CF85;flex:none}
.net.off{background:#FF7479}

main{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:14px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.tab{border:0;background:none;padding:6px 4px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;font-weight:600}
.tab svg{width:24px;height:24px}
.tab[aria-current="true"]{color:var(--ink);background:var(--paper)}

.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
h2{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.1;margin:0;text-wrap:balance;text-transform:uppercase}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0} .full{grid-column:1/-1}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:700;font-size:16px;background:var(--brand);color:var(--brand-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{min-height:38px;padding:8px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.btn.block{width:100%}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:11px 12px;font-size:16px;min-width:0}
.field.warn input,.field.warn select{border-color:var(--warn)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:15px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.banner{border-radius:12px;padding:12px 14px;font-size:14px;background:var(--warn-bg);color:var(--warn)}

.shoot{border:2.5px dashed var(--line);border-radius:16px;background:var(--paper);min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;position:relative;overflow:hidden}
.shoot .big{width:78px;height:78px;border-radius:50%;background:var(--tag);color:var(--tag-ink);display:grid;place-items:center}
.shoot .big svg{width:38px;height:38px}
.shoot strong{font-family:var(--f-display);font-size:22px;text-transform:uppercase}
.shoot input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.preview{width:100%;max-height:340px;object-fit:contain;border-radius:12px;background:var(--paper);display:block}
.scanning{position:relative}
.scanning::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--tag);box-shadow:0 0 12px var(--tag);top:0;animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{to{top:calc(100% - 3px)}}
@media (prefers-reduced-motion:reduce){.scanning::after{animation:none;top:50%}}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .2s}

.tag{background:var(--tag);color:var(--tag-ink);border-radius:8px;padding:8px 12px 6px;display:flex;flex-direction:column;line-height:1;min-width:0}
.tag .w{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.tag .p{font-family:var(--f-display);font-weight:800;font-size:38px;font-variant-numeric:tabular-nums}
.tag .p small{font-size:20px;vertical-align:top;margin-right:1px}
.tag .c{font-size:13px;font-weight:600;margin-top:2px}
.tag.ours{background:var(--ink);color:var(--paper)}
.duel{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.verdict{border-radius:12px;padding:12px 14px}
.verdict .v-t{font-family:var(--f-display);font-weight:700;font-size:24px;text-transform:uppercase;line-height:1}
.verdict .v-s{font-weight:500;font-size:14px;margin-top:2px}
.v-good{background:var(--good-bg);color:var(--good)} .v-bad{background:var(--bad-bg);color:var(--bad)}
.v-warn{background:var(--warn-bg);color:var(--warn)} .v-none{background:var(--paper);color:var(--muted)}

.chains{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.chain{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.chain:first-child{border-top:0}
.chain .cn{font-weight:700;font-size:14px;min-width:68px}
.chain .cd{font-size:13px;color:var(--muted);min-width:0}
.chain .cp{font-family:var(--f-display);font-weight:700;font-size:22px;text-align:right}
.diff{font-size:12px;font-weight:700;display:block;text-align:right;font-family:var(--f-body)}
.diff.good{color:var(--good)} .diff.bad{color:var(--bad)}
.alt{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.alt-h{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.alt-n{font-weight:700;min-width:0}
.alt-p{font-family:var(--f-display);font-weight:700;font-size:22px;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--paper);color:var(--muted)}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.brand{background:var(--ink);color:var(--paper)}
.speech{background:var(--paper);border-left:4px solid var(--tag);border-radius:10px;padding:12px 14px;font-size:16px}
details summary{cursor:pointer;font-size:14px;color:var(--muted)}
details pre{white-space:pre-wrap;font-size:13px;background:var(--paper);padding:10px;border-radius:8px;margin:8px 0 0}

.feed{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--card);border-radius:12px;padding:10px;box-shadow:var(--shadow);border:0;text-align:left;width:100%}
.thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--paper);display:block}
.item .t{font-weight:700;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item .m{font-size:13px;color:var(--muted)}
.item .pr{font-family:var(--f-display);font-weight:700;font-size:20px;text-align:right}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:12px;padding:10px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--f-display);font-size:26px;line-height:1}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.stat.good b{color:var(--good)} .stat.bad b{color:var(--bad)}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:14px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:600;z-index:30;font-size:14px;max-width:90%;text-align:center}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;display:inline-block;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:20px;text-transform:uppercase;margin-bottom:4px}
@media (max-width:380px){.duel{grid-template-columns:1fr}.tag .p{font-size:34px}}

.filebtn{position:relative;overflow:hidden;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:0}
#busy{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.55);touch-action:none}
#busy.on{display:flex}
#busy .box{background:var(--card,#fff);color:var(--fg,#111);border-radius:16px;padding:22px 26px;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:80%;text-align:center;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#busy .spin{width:34px;height:34px;border:4px solid rgba(127,127,127,.3);border-top-color:#2563eb;border-radius:50%;animation:spinb .8s linear infinite}
@keyframes spinb{to{transform:rotate(360deg)}}
.combo{position:relative}
.combo-ul{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:4px 0;list-style:none;max-height:260px;overflow:auto;background:var(--card,#fff);color:inherit;border:1px solid rgba(127,127,127,.4);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,.2);z-index:30}
.combo-ul li{padding:12px 14px;min-height:44px;display:flex;align-items:center;cursor:pointer}
.combo-ul li:active,.combo-ul li:hover{background:rgba(127,127,127,.18)}
.combo-ul li.muted{cursor:default}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="logo">LUPA<b>Black</b></div>
  <div class="who" id="who"></div>
  <span class="net" id="net" title="Conexión"></span>
</div></header>
<main id="app"></main>
<p class="muted" style="text-align:center;font-size:11px;margin:0 0 calc(90px + env(safe-area-inset-bottom,0px))">LUPA v2026.11.10-3</p>
<nav class="tabs"><div class="tabs-in" id="tabs"></div></nav>
<div id="toastBox"></div>
<div id="busy" role="alert" aria-live="assertive"><div class="box"><span class="spin"></span><span id="busyMsg">Guardando en el Sheet…</span><small style="font-weight:400">No cierres ni toques la pantalla</small></div></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="parser.js?v=2026.11.10-3"></script>
<script src="matcher.js?v=2026.11.10-3"></script>
<script src="config.js?v=2026.11.10-3"></script>
<script>
/* ============ configuración (config.js) ============ */
const VERSION="2026.11.10-3";
const CFG=Object.assign({
  API_URL:"https://script.google.com/macros/s/AKfycbxVPV8O8qQpirRpsYI6228qiYEihwPitAvIew0lJgE_FLygEm8mFU9wIEIA6yY4jVM0Ow/exec",
  COMPETIDORES:["Artefacta","Marcimex","Comandato","Almacenes España","Jaher","Al Precio","Tía","Pycca","La Ganga","Otro"],
  CADENAS:["Crecos","Orve Hogar","Japón","Motozone","Pagamenos"],
  AGENCIAS:[]
},Object.fromEntries(Object.entries(window.CAZA_CONFIG||{}).filter(([k,v])=>!(k==="API_URL"&&!v))));
CFG.AGENCIAS=[...CFG.AGENCIAS].sort((a,b)=>a.localeCompare(b,"es"));
const CATEGORIAS=Matcher.CATS;
const FRECUENCIAS=["mensual","quincenal","semanal"];
const ICON={
 cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
 list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>'
};

/* ============ estado ============ */
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}};
const S={tab:"capturar",flow:"idle",cola:[],total:0,hecha:0,photoUrl:"",photo:null,draft:null,ocrPct:0,ocrMsg:"",iaError:"",iaDetalle:"",
  editing:null,mis:ls.get("ch_mis",[]),perfil:ls.get("ch_perfil",null),tienda:ls.get("ch_tienda","Artefacta"),
  agencia:ls.get("ch_agencia",""),online:navigator.onLine,misMsg:"",faltan:[],guardando:false,capId:null};

/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=CazaParser.norm;
function money(v){
  if(v==null||v==="")return null; if(typeof v==="number")return isFinite(v)?v:null;
  let s=String(v).replace(/[^\d.,-]/g,""); if(!s)return null;
  const lc=s.lastIndexOf(","),ld=s.lastIndexOf(".");
  if(lc>-1&&ld>-1){s=lc>ld?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"");}
  else if(lc>-1){s=(s.length-lc-1===2||s.length-lc-1===1)?s.replace(",","."):s.replace(/,/g,"");}
  else if(ld>-1&&s.length-ld-1===3){s=s.replace(/\./g,"");}
  const n=parseFloat(s); return isFinite(n)?n:null;
}
const fmt=n=>n==null||n===""?"—":"$"+Number(n).toLocaleString("es-EC",{minimumFractionDigits:Number(n)%1?2:0,maximumFractionDigits:2});
const ago=t=>{const m=Math.round((Date.now()-t)/60000);if(m<1)return "ahora";if(m<60)return `hace ${m} min`;const h=Math.round(m/60);if(h<24)return `hace ${h} h`;return new Date(t).toLocaleDateString("es-EC",{day:"numeric",month:"short"});};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const isCresa=t=>CFG.CADENAS.includes(t);
const queue=()=>ls.get("ch_queue",[]);
function toast(msg,ms=2800){const b=$("#toastBox");b.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>b.innerHTML="",ms);}
function thumbSrc(c){return c&&c.foto_id?`https://drive.google.com/thumbnail?id=${encodeURIComponent(c.foto_id)}&sz=w480`:"";}

/* ============ API (Google Apps Script) ============ */
async function apiGet(action,extra=""){
  const r=await fetch(`${CFG.API_URL}?action=${action}&pin=${encodeURIComponent(S.perfil?.pin||"")}${extra}`);
  const j=await r.json(); if(!j.ok)throw new Error(j.error||"error"); return j;
}
async function apiPost(body){
  const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),30000);
  try{
    const r=await fetch(CFG.API_URL,{method:"POST",signal:ctl.signal,headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,pin:S.perfil?.pin||""})});
    const j=await r.json(); if(!j.ok)throw new Error(j.error||"error"); return j;
  }finally{clearTimeout(tm);}
}
// Pantalla de "guardando": bloquea toques hasta que termine
function ocupado(on,msg){
  $("#busyMsg").textContent=msg||"Guardando en el Sheet…";
  $("#busy").classList.toggle("on",!!on);
}
async function conBloqueo(fn,msg){
  if(S.guardando)return;
  S.guardando=true;ocupado(true,msg);
  try{await fn();}finally{S.guardando=false;ocupado(false);}
}

/* ============ lectura de la foto ============ */

let worker=null;
async function getWorker(){
  if(worker)return worker;
  worker=await Tesseract.createWorker("spa",1,{logger:m=>{
    if(m.status==="recognizing text"){S.ocrPct=Math.round(m.progress*100);S.ocrMsg="Leyendo el preciador";}
    else if(/loading|initializ/.test(m.status||"")){S.ocrMsg="Preparando lector (solo la primera vez)";S.ocrPct=Math.round((m.progress||0)*100);}
    const bar=$("#ocrBar i");if(bar)bar.style.width=S.ocrPct+"%";const t=$("#ocrMsg");if(t)t.textContent=S.ocrMsg;
  }});
  return worker;
}
async function prepImage(file){
  const bmp=await createImageBitmap(file);
  const fit=(max)=>{const k=Math.min(1,max/Math.max(bmp.width,bmp.height));return [Math.round(bmp.width*k),Math.round(bmp.height*k)];};
  // foto para guardar (liviana)
  const [w1,h1]=fit(1600);const c1=document.createElement("canvas");c1.width=w1;c1.height=h1;c1.getContext("2d").drawImage(bmp,0,0,w1,h1);
  const save=c1.toDataURL("image/jpeg",.8);
  // imagen para el OCR: más grande, gris y con contraste
  const [w2,h2]=fit(2000);const c2=document.createElement("canvas");c2.width=w2;c2.height=h2;const x=c2.getContext("2d");x.drawImage(bmp,0,0,w2,h2);
  const d=x.getImageData(0,0,w2,h2),p=d.data;
  for(let i=0;i<p.length;i+=4){let g=.299*p[i]+.587*p[i+1]+.114*p[i+2];g=(g-128)*1.5+128;g=g<0?0:g>255?255:g;p[i]=p[i+1]=p[i+2]=g;}
  x.putImageData(d,0,0);
  return {save,ocr:c2};
}
// 1) IA de Google (Gemini, nivel gratis) a través del Apps Script: lee letra a mano, caja y cartel.
// 2) Si no hay clave, se acabó la cuota o no hay señal: lector básico dentro del teléfono.
async function leerConIA(foto){
  if(!CFG.API_URL){S.iaError="sin_url";return null;}
  if(!S.perfil?.pin){S.iaError="sin_pin";return null;}
  if(!navigator.onLine){S.iaError="sin_senal";return null;}
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),35000);
  try{
    const r=await fetch(CFG.API_URL,{method:"POST",signal:ctl.signal,headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action:"leer",pin:S.perfil.pin,foto,listas:{tiendas:CFG.COMPETIDORES.filter(x=>x!=="Otro").concat(CFG.CADENAS),repo:{lineas:REPO.promptLineas,marcas:REPO.marcas}}})});
    const j=await r.json();
    if(!j.ok){S.iaError=j.error||"desconocido";S.iaDetalle=j.detalle||JSON.stringify(j).slice(0,200);return null;}
    if(!j.datos){S.iaError="script_viejo";return null;}
    return j.datos;
  }catch(e){S.iaError=e&&e.name==="AbortError"?"tiempo":"red";S.iaDetalle=String(e&&e.message||e).slice(0,200);return null;}finally{clearTimeout(t);}
}
const IA_ERR={sin_url:"La app no tiene la URL del Sheet.",sin_pin:"Falta el PIN del equipo.",sin_senal:"El teléfono no tiene señal.",
  red:"No se pudo conectar con el Apps Script. Revisa que la implementación diga «Cualquier persona».",tiempo:"La IA tardó demasiado en responder.",
  pin:"El PIN no coincide con el de la pestaña Config.",accion:"El Apps Script tiene la versión vieja: pega el Code.gs nuevo y publica una «Nueva versión».",
  script_viejo:"El Apps Script tiene la versión vieja: pega el Code.gs nuevo y publica una «Nueva versión».",
  sin_clave:"Falta la clave: pon gemini_key en la pestaña Config.",gemini_429:"Se acabó la cuota gratis de IA de hoy.",
  gemini_403:"La clave de IA no es válida o no tiene permiso.",gemini_401:"La clave de IA no es válida.",gemini_404:"El modelo de IA no está disponible para esa clave.",
  gemini_400:"La IA rechazó la foto (formato).",gemini_respuesta:"La IA respondió algo que no se pudo leer.",excepcion:"El Apps Script tuvo un error interno (mira el detalle)."};
const iaErrTxt=e=>IA_ERR[e]||(e?`Error de IA: ${e}`:"");
function tiendaDetectada(txt){
  if(!txt)return null;const n=norm(txt);
  return CFG.CADENAS.concat(CFG.COMPETIDORES).find(t=>t!=="Otro"&&(n.includes(norm(t))||norm(t).includes(n)))||null;
}

/* Sin IA o sin señal: lectura básica dentro del teléfono (no entiende letra a mano). */
function draftDesdeIA(d){
  const num=v=>{const x=money(v);return x!=null&&x>0?x:null;};
  const m=d.medidas||{};
  const out={producto:d.producto||"",marca:d.marca||"",modelo:(d.codigo||"").toUpperCase(),
    ...resolverRepo(d),
    contado:num(d.precio_contado),antes:num(d.precio_antes),pvp_lista:num(d.pvp_lista),
    cuota:num(d.cuota),ncuotas:num(d.num_cuotas),
    frecuencia:FRECUENCIAS.includes(norm(d.frecuencia||""))?norm(d.frecuencia):"",
    entrada:d.entrada===0||d.entrada==="0"?0:num(d.entrada),precio_final:num(d.precio_final),
    plan:d.plan_credito||"",regalo:d.regalo||"",
    litros:num(m.litros),btu:num(m.btu),pulgadas:num(m.pulgadas),kg:num(m.kg),pies3:num(m.pies3),watts:num(m.watts),
    especificaciones:d.especificaciones||"",legible:d.legible!==false,_leido:true,_ia:true,_aviso:d.aviso||""};
  // regla de oro: una cuota nunca es precio de contado
  if(out.cuota!=null&&out.contado!=null&&Math.abs(out.cuota-out.contado)<0.01)out.contado=null;
  if(out.antes!=null&&out.contado!=null&&out.antes<out.contado){const t=out.antes;out.antes=out.contado;out.contado=t;}
  return out;
}
function draftDesdeBasico(p){
  return {producto:p.producto||"",marca:p.marca||"",modelo:p.modelo||"",catc:"",linea:"",grupo:"",sub_grupo:"",capacidad:"",
    contado:p.contado,antes:p.normal,cuota:p.cuota,ncuotas:p.ncuotas,frecuencia:p.frecuencia||"",entrada:p.entrada,
    plan:p.plan||"",regalo:p.regalo||"",texto:p.texto||"",_leido:true,_basico:true};
}
function avisosDe(d){
  const has=k=>d[k]!=null&&d[k]!=="";
  const a=[];
  if(d._aviso)a.push(d._aviso);
  if(!S.agencia)a.push("Elige arriba la agencia donde estás.");
  if(!has("producto")&&!has("modelo"))a.push("No se leyó el producto ni el código.");
  if(!has("contado")&&!has("cuota"))a.push("No se leyó ningún precio: escríbelo a mano o toma otra foto.");
  if(has("cuota")&&!has("contado"))a.push("Solo hay cuota: confirma si el cartel tiene precio de contado.");
  if(has("cuota")&&!has("ncuotas"))a.push("Falta el número de cuotas (plazo).");
  if(has("cuota")&&has("ncuotas")&&has("precio_final")){
    const calc=d.cuota*d.ncuotas;
    if(Math.abs(calc-d.precio_final)>0.02*d.precio_final)a.push(`Cuota × plazo (${fmt(calc)}) no coincide con el precio final (${fmt(d.precio_final)}): revisa.`);
  }
  if(has("precio_final")&&has("contado")&&d.precio_final<d.contado)a.push("El precio final a crédito es menor que el de contado: revisa.");
  return a;
}
async function onPhoto(file){
  if(!file)return;
  S.flow="reading";S.ocrPct=0;S.ocrMsg="Preparando la foto";S.photoUrl=URL.createObjectURL(file);S.iaError="";S.iaDetalle="";render();
  let img;
  try{img=await prepImage(file);}catch{toast("No se pudo abrir la foto");siguiente();return;}
  S.photo=img.save;
  S.ocrMsg="Leyendo el preciador con IA";S.ocrPct=30;render();
  const ia=await leerConIA(img.save);
  let draft;
  if(ia){
    draft=draftDesdeIA(ia);
    const t=tiendaDetectada(ia.tienda);
    if(t){S.tienda=t;ls.set("ch_tienda",t);draft._tiendaDet=t;}
  }else{
    try{
      S.ocrMsg="Lector básico (sin IA)";render();
      const w=await getWorker();
      const {data}=await w.recognize(img.ocr);
      const lines=(data.lines||[]).map(l=>({text:l.text,h:(l.bbox?.y1||0)-(l.bbox?.y0||0)}));
      draft=draftDesdeBasico({...CazaParser.parseTag(lines.length?lines:data.text||"",{brands:[]})});
    }catch(e){console.error(e);toast("No se pudo leer. Llena los datos a mano.");draft={_leido:true,_basico:true};}
  }
  S.draft=draft;
  S.flow="review";render();
}
function empezarFotos(files){
  const arr=[...files];
  if(!arr.length)return;
  S.cola=arr.slice(1);S.total=arr.length;S.hecha=0;
  onPhoto(arr[0]);
}
function escribirManual(){
  S.draft={_leido:false};S.photo=null;S.photoUrl="";S.cola=[];S.total=1;S.hecha=0;S.flow="review";render();
}
function siguiente(){
  S.capId=null;
  if(S.cola.length){onPhoto(S.cola.shift());return;}
  S.flow="idle";S.draft=null;S.photo=null;S.photoUrl="";S.total=0;S.hecha=0;render();
}

/* ============ guardar (con cola sin señal) ============ */
function enqueue(item){const q=queue();q.push(item);ls.set("ch_queue",q);renderNet();}
async function enviar(item){
  if(!CFG.API_URL||!navigator.onLine){enqueue(item);return "cola";}
  try{await apiPost({action:"guardar",captura:item.cap,foto:item.foto});return "ok";}
  catch(e){if(String(e.message)==="pin")return "pin";enqueue(item);return "cola";}
}
let enviando=false;
async function flushQueue(){
  if(enviando||!navigator.onLine||!CFG.API_URL||!S.perfil)return;
  const q=queue();if(!q.length)return;
  enviando=true;
  const left=[];
  for(const it of q){try{await apiPost({action:"guardar",captura:it.cap,foto:it.foto});}catch(e){left.push(it);}}
  ls.set("ch_queue",left);enviando=false;renderNet();
  if(q.length!==left.length)toast(`Se enviaron ${q.length-left.length} captura(s) pendientes`);
}

async function guardarCaptura(){
  if(S.guardando)return;
  if(!S.agencia){toast("Elige primero la agencia donde estás");return;}
  const v=readForm();
  if(!validarRepo(v))return;
  if(!v.producto&&!v.modelo){toast("Escribe el producto o el código");return;}
  if(v.contado==null&&v.cuota==null){toast("Falta el precio de contado o la cuota");return;}
  // mismo id aunque toquen dos veces: el servidor ignora el repetido
  S.capId=S.capId||uid();
  const cap={id:S.capId,creado:Date.now(),autor:S.perfil.nombre,agencia:S.agencia,competidor:S.tienda,
    origen:isCresa(S.tienda)?"cresa":"competencia",...v,categoria_comercial:v.catc,categoria:v.linea,texto_ocr:S.draft?.texto||""};
  let res;
  await conBloqueo(async()=>{res=await enviar({cap,foto:S.photo||""});});
  if(res==="pin"){toast("El PIN no coincide. Revisa con tu coordinador.");return;}
  S.capId=null;
  S.mis=[capParaMis(cap),...S.mis].slice(0,300);ls.set("ch_mis",S.mis);
  toast(res==="ok"?"Guardada en el Sheet":"Sin señal: quedó en el teléfono y se envía sola");
  S.hecha++;siguiente();
}
async function guardarEdicion(){
  const c=S.editing;const v=readForm();
  if(!validarRepo(v))return;
  const campos={...v,categoria_comercial:v.catc,categoria:v.linea,num_cuotas:v.ncuotas,agencia:$("#f-agencia")?.value||c.agencia,competidor:$("#f-tienda")?.value||c.competidor};

  if(!navigator.onLine||!CFG.API_URL){toast("Sin señal: no se pudo guardar el cambio");return;}
  await conBloqueo(async()=>{
    try{
      await apiPost({action:"editar",id:c.id,autor:S.perfil.nombre,campos});
      const nuevo={...c,...campos,ncuotas:v.ncuotas};
      S.mis=S.mis.map(x=>x.id===c.id?nuevo:x);ls.set("ch_mis",S.mis);

async function cargarMis(){
  if(!navigator.onLine||!CFG.API_URL||!S.perfil)return;
  try{
    const j=await apiGet("capturas","&n=500");
    const mias=j.rows.filter(r=>r.autor===S.perfil.nombre).sort((a,b)=>(b.fecha||0)-(a.fecha||0)).slice(0,300);
    // conserva las que aún están en la cola del teléfono
    const pend=queue().map(i=>capParaMis(i.cap)).filter(p=>!mias.some(m=>m.id===p.id));
    S.mis=[...pend,...mias];ls.set("ch_mis",S.mis);S.misMsg="";
  }catch(e){S.misMsg=String(e.message)==="pin"?"El PIN no coincide":"No se pudo actualizar: sin señal";}
  render();
}


/* ============ repositorio de Cresa: categoría, línea, grupo, sub grupo, marca y capacidad ============ */
// Solo se guardan opciones que existen en el repositorio (repositorio.json, generado de REPOSITORIO_PRODUCTO.xlsx).
const REPO={ok:false,categorias:[],lineas:[],marcas:[],promptLineas:[],info:new Map(),catcOf:new Map()};
async function cargarRepo(){
  try{
    const r=await fetch("repositorio.json?v="+VERSION);const j=await r.json();
    REPO.marcas=j.marcas;
    REPO.promptLineas=j.lineas.map(l=>({linea:l.linea,categoria:l.categoria,grupos:l.grupos.map(g=>g.grupo)}));
    REPO.lineas=j.lineas.map(l=>l.linea).sort((a,b)=>a.localeCompare(b,"es"));
    REPO.categorias=[...new Set(j.lineas.map(l=>l.categoria))].sort((a,b)=>a.localeCompare(b,"es"));
    j.lineas.forEach(l=>{
      REPO.catcOf.set(l.linea,l.categoria);
      REPO.info.set(l.linea,{grupos:l.grupos.map(g=>g.grupo).sort((a,b)=>a.localeCompare(b,"es")),
        subsDe:new Map(l.grupos.map(g=>[g.grupo,g.subs])),
        subs:[...new Set(l.grupos.flatMap(g=>g.subs))].sort((a,b)=>a.localeCompare(b,"es")),
        caps:l.caps});
    });
    REPO.ok=true;
  }catch(e){REPO.ok=false;}
}
const RKEY=s=>norm(s||"").replace(/[^a-z0-9]/g,"");
function repoOpciones(catc,linea,grupo){
  const inf=linea?REPO.info.get(linea):null;
  return {categorias:REPO.categorias,
    lineas:REPO.lineas.filter(l=>!catc||REPO.catcOf.get(l)===catc),
    grupos:inf?inf.grupos:[],
    subs:inf?(grupo?(inf.subsDe.get(grupo)||[]):inf.subs):[],
    caps:inf?inf.caps:[],
    marcas:REPO.marcas};
}
function pickRepo(lista,val){
  const k=RKEY(val);if(!k)return "";
  const eq=lista.find(x=>RKEY(x)===k);if(eq)return eq;
  return lista.find(x=>{const y=RKEY(x);return y.length>3&&k.length>3&&(k.includes(y)||y.includes(k));})||"";
}
// "55 PULGADAS" → {lo:55,hi:55,unit:"pulgadas"}; "651 - 750LT" → {lo:651,hi:750,unit:"litros"}
function parseCap(t){
  const u=String(t).toUpperCase().replace(/–/g,"-");
  let lo=null,hi=null,m=u.match(/(\d+(?:[.,]\d+)?)\s*-\s*(\d+(?:[.,]\d+)?)/);
  if(m){lo=parseFloat(m[1].replace(",","."));hi=parseFloat(m[2].replace(",","."));}
  else{m=u.match(/(\d+(?:[.,]\d+)?)/);if(m)lo=hi=parseFloat(m[1].replace(",","."));}
  let unit=null;
  if(/PULG/.test(u))unit="pulgadas";
  else if(/BTU/.test(u))unit="btu";
  else if(/LITRO|\dLTS?\b/.test(u))unit="litros";
  else if(/KILO|\dKG\b|\bKG\b/.test(u))unit="kg";
  else if(/QUEMADOR/.test(u))unit="quemadores";
  else if(/PIES/.test(u))unit="pies3";
  else if(/WATT|\dW\b/.test(u))unit="watts";
  else if(/\bCC\b/.test(u))unit="cc";
  return {lo,hi,unit};
}
const KIND_OF={litros:"litros",btu:"btu",pulgadas:"pulgadas",kg:"kg",pies3:"pies3",watts:"watts",quemadores:"quemadores",cc:"cc"};
function capacidadDesde(linea,med){
  const inf=REPO.info.get(linea);if(!inf||!med)return "";
  for(const [k,v] of Object.entries(med)){
    if(v==null||v===""||!KIND_OF[k])continue;
    // "12BTU" en la caja significa 12 000 BTU: prueba también el valor en miles
    const xs=k==="btu"&&Number(v)<100?[Number(v),Number(v)*1000]:[Number(v)];
    // si varios rangos contienen el valor (ej. 501-750 y 651-750), gana el más estrecho
    let hit="",ancho=Infinity;
    inf.caps.forEach(c=>{const p=parseCap(c);
      const uni=p.unit===KIND_OF[k]||(k==="cc"&&p.unit==null&&linea==="Motocicletas");
      if(uni&&p.lo!=null&&xs.some(x=>x>=p.lo&&x<=p.hi)&&(p.hi-p.lo)<ancho){hit=c;ancho=p.hi-p.lo;}});
    if(hit)return hit;
  }
  return "";
}
// Lo que dijo la IA → opciones exactas del repositorio (lo que no encaja queda vacío para elegirlo a mano)
function resolverRepo(d){
  const out={catc:"",linea:"",grupo:"",sub_grupo:"",marca:"",capacidad:""};
  if(!REPO.ok)return out;
  out.linea=pickRepo(REPO.lineas,d.linea);
  if(out.linea){
    out.catc=REPO.catcOf.get(out.linea)||"";
    const inf=REPO.info.get(out.linea);
    out.grupo=pickRepo(inf.grupos,d.grupo);
    const subs=out.grupo?(inf.subsDe.get(out.grupo)||[]):inf.subs;
    out.sub_grupo=pickRepo(subs,d.sub_grupo);
    if(!out.sub_grupo){
      const txt=RKEY([d.producto,d.especificaciones,d.codigo].join(" "));let best="";
      subs.forEach(x=>{const k=RKEY(x);if(k.length>=3&&txt.includes(k)&&k.length>RKEY(best).length)best=x;});
      out.sub_grupo=best;
    }
    out.capacidad=capacidadDesde(out.linea,d.medidas);
  }
  out.marca=pickRepo(REPO.marcas,d.marca);
  return out;
}
const ETIQ_REPO={catc:"Categoría comercial",linea:"Línea",grupo:"Grupo",sub_grupo:"Sub grupo",marca:"Marca",capacidad:"Capacidad"};
function validarRepo(v){
  if(!REPO.ok){toast("No cargó el repositorio. Revisa la conexión y recarga la página.");return false;}
  const falta=["catc","linea","grupo","sub_grupo","marca"].filter(k=>!v[k]);
  if(v.linea&&REPO.info.get(v.linea)?.caps.length&&!v.capacidad)falta.push("capacidad");
  if(falta.length){S.faltan=falta;S.draft={...S.draft,...v};toast("Falta: "+falta.map(k=>ETIQ_REPO[k]).join(", "));render();return false;}
  S.faltan=[];return true;
}
function draftDesdeCap(c){
  return {producto:c.producto||"",marca:c.marca||"",modelo:c.modelo||"",
    catc:c.categoria_comercial||"",linea:c.linea||"",grupo:c.grupo||"",sub_grupo:c.sub_grupo||"",capacidad:c.capacidad||"",
    contado:c.contado??"",antes:c.antes??"",pvp_lista:c.pvp_lista??"",cuota:c.cuota??"",ncuotas:c.num_cuotas??c.ncuotas??"",
    frecuencia:c.frecuencia||"",entrada:c.entrada??"",precio_final:c.precio_final??"",plan:c.plan||"",regalo:c.regalo||"",
    litros:c.litros??"",btu:c.btu??"",pulgadas:c.pulgadas??"",kg:c.kg??"",pies3:c.pies3??"",watts:c.watts??"",
    especificaciones:c.especificaciones||"",agencia:c.agencia||"",competidor:c.competidor||"",_leido:false};
}

function viewOnboard(){
  return `<section class="card"><h2>Entrar a LUPA</h2>
    <div class="small muted">Tu nombre y el PIN del equipo. Nada más. La agencia la eliges al capturar.</div>
    <div class="field"><label for="ob-nombre">Tu nombre</label><input id="ob-nombre" autocomplete="name" value=""></div>
    <div class="field"><label for="ob-pin">PIN del equipo</label><input id="ob-pin" inputmode="numeric" type="password" autocomplete="off"></div>
    <button class="btn block" id="entrar">Entrar</button></section>`;
}
function viewCapture(){
  let h=(REPO.ok?"":`<div class="banner">No se cargó el repositorio de productos: revisa la conexión y recarga.</div>`)+`<section class="card"><div class="lbl">Agencia donde estás hoy</div>${CFG.AGENCIAS.length?comboHTML("agencia"):selAg("ag-sel",S.agencia)}
    <div class="small muted">Se recuerda la última. Cámbiala si hoy estás en otra.</div></section>`;
  if(S.flow==="idle"){
    h+=`<section class="card"><div class="lbl">¿De quién es el preciador?</div>${comboHTML("tienda")}
      <div class="small muted">Escribe para buscar o elige de la lista de competencia.</div></section>
    <section class="card"><div class="shoot"><div class="big">${ICON.cam}</div><strong>Foto al preciador</strong>
      <strong style="font-size:15px;text-align:center">Toma foto al preciador y trata de conseguir la mayor cantidad de información sobre esa promo o combo.</strong>
      <span class="muted small">Una etiqueta por foto. Puedes elegir varias de la galería.</span>
      <input id="cam" type="file" accept="image/*" capture="environment" aria-label="Tomar foto del preciador"></div>
      <div class="filebtn btn ghost block">Elegir fotos de la galería<input id="gal" type="file" accept="image/*" multiple aria-label="Elegir fotos de la galería"></div>
      <div class="small muted" style="line-height:1.5"><b>Para que LUPA lo lea bien:</b>
        <br>• Que salgan completos el nombre del producto y el precio grande.
        <br>• Si hay cuota: que salgan juntos el precio de cuota, el plazo (12 meses, x 24) y el precio de contado, con su rótulo («contado», «PVP», «cuotas»).
        <br>• Si la hoja de crédito está aparte del producto, fotografíala también.
        <br>• De frente, de cerca y sin reflejo. Una etiqueta por foto.</div>
      <button class="btn ghost block" id="manual">Escribir a mano, sin foto</button></section>`;
  }
  if(S.flow==="reading")h+=`<section class="card"><div class="scanning"><img class="preview" src="${S.photoUrl}" alt="Foto del preciador"></div>
    <div class="row"><span class="spin"></span><strong id="ocrMsg">${esc(S.ocrMsg)}</strong></div><div class="bar" id="ocrBar"><i style="width:${S.ocrPct}%"></i></div>
    ${S.total>1?`<div class="small muted">Foto ${S.hecha+1} de ${S.total}</div>`:""}</section>`;
  if(S.flow==="review")h+=reviewForm(S.draft||{},{});
  return h;
}
function repoBloque(d){
  const o=repoOpciones(d.catc,d.linea,d.grupo);
  const f=k=>S.faltan?.includes(k)?"field warn":"field";
  const opt=(arr,val)=>`<option value="">— Elige —</option>`+arr.map(a=>`<option ${a===val?"selected":""}>${esc(a)}</option>`).join("");
  return `<div class="${f("catc")} full"><label for="f-catc">Categoría comercial *</label><select id="f-catc">${opt(o.categorias,d.catc)}</select></div>
    <div class="${f("linea")} full"><label for="f-linea">Línea *</label><select id="f-linea">${opt(o.lineas,d.linea)}</select></div>
    <div class="${f("grupo")} full"><label for="f-grupo">Grupo *</label><select id="f-grupo">${opt(o.grupos,d.grupo)}</select></div>
    <div class="${f("sub_grupo")} full"><label for="f-sub">Sub grupo *</label><select id="f-sub">${opt(o.subs,d.sub_grupo)}</select></div>
    <div class="${f("marca")} full"><label for="f-marca">Marca *</label><select id="f-marca">${opt(o.marcas,d.marca)}</select></div>
    <div class="${f("capacidad")} full"><label for="f-capacidad">Capacidad * (pulgadas, litros, BTU, kilos…)</label><select id="f-capacidad">${opt(o.caps,d.capacidad)}</select></div>`;
}
function reviewForm(d,opt={}){
  const ed=!!opt.editing;
  const has=k=>d[k]!=null&&d[k]!=="";
  const v=k=>has(k)?esc(d[k]):"";
  const n=k=>has(k)?esc(d[k]):"";
  const credito=["cuota","ncuotas","frecuencia","entrada","plan","precio_final","pvp_lista"].some(has);
  const tech=["litros","btu","pulgadas","kg","pies3","watts","especificaciones"].some(has);
  const precios=["antes","regalo"].some(has);
  const avisos=ed?[]:avisosDe(d);
  const tienda=opt.tienda||S.tienda;
  const img=opt.thumb||S.photoUrl;
  const iaNota=d._basico&&!ed?`<div class="banner"><b>No se usó la IA:</b> ${esc(iaErrTxt(S.iaError))}${S.iaDetalle?`<br><small style="word-break:break-word">Detalle: ${esc(S.iaDetalle)}</small>`:""}<br>El lector básico no entiende letra a mano; revisa bien.</div>`:"";
  const origen=d._ia?`<span class="pill good">Leído con IA</span>`:d._basico&&!ed?`<span class="pill warn">Lector básico</span>`:"";
  const opts=(arr,val)=>`<option value="">—</option>`+arr.map(a=>`<option ${a===val?"selected":""}>${esc(a)}</option>`).join("");
  return `<section class="card">
    ${img?`<img class="preview" src="${esc(img)}" alt="Foto del preciador" referrerpolicy="no-referrer">`:""}
    <div><h2>${ed?"Editar captura":"Revisa los datos"}</h2>
      <div class="row" style="margin-top:6px"><span class="pill ${isCresa(tienda)?"brand":""}">${esc(tienda)}</span><span class="pill">${esc(ed?(d.agencia||"sin agencia"):(S.agencia||"sin agencia"))}</span>${S.total>1&&!ed?`<span class="pill">Foto ${S.hecha+1} de ${S.total}</span>`:""}${origen}</div></div>
    ${iaNota}${avisos.length?`<div class="banner"><b>Revisa antes de guardar:</b><ul style="margin:6px 0 0 18px;padding:0">${avisos.map(a=>`<li>${esc(a)}</li>`).join("")}</ul></div>`:""}
    ${ed?`<div class="grid2">
      <div class="field"><label for="f-agencia">Agencia</label>${selAg("f-agencia",d.agencia)}</div>
      <div class="field"><label for="f-tienda">Preciador de</label><select id="f-tienda">${opts([...CFG.COMPETIDORES,...CFG.CADENAS],d.competidor)}</select></div></div>`:""}
    <div class="grid2">
      <div class="field full"><label for="f-producto">Producto</label><input id="f-producto" value="${v("producto")}" placeholder="Split inverter 12 BTU"></div>
      ${repoBloque(d)}
      <div class="field"><label for="f-modelo">Código o modelo</label><input id="f-modelo" value="${v("modelo")}" autocapitalize="characters"></div>
      <div class="field full"><label for="f-contado">Precio de contado $</label><input id="f-contado" inputmode="decimal" value="${n("contado")}"></div>
    </div>
    <details ${tech?"open":""}><summary>Características del producto</summary>
      <div class="grid2" style="margin-top:10px">
        <div class="field"><label for="f-litros">Litros</label><input id="f-litros" inputmode="decimal" value="${n("litros")}"></div>
        <div class="field"><label for="f-btu">BTU</label><input id="f-btu" inputmode="decimal" value="${n("btu")}"></div>
        <div class="field"><label for="f-pulgadas">Pulgadas</label><input id="f-pulgadas" inputmode="decimal" value="${n("pulgadas")}"></div>
        <div class="field"><label for="f-kg">Kilos</label><input id="f-kg" inputmode="decimal" value="${n("kg")}"></div>
        <div class="field"><label for="f-pies3">Pies cúbicos</label><input id="f-pies3" inputmode="decimal" value="${n("pies3")}"></div>
        <div class="field"><label for="f-watts">Watts</label><input id="f-watts" inputmode="decimal" value="${n("watts")}"></div>
        <div class="field full"><label for="f-espec">Tecnología y tipo</label><input id="f-espec" value="${v("especificaciones")}" placeholder="Inverter · Blanco · Frío"></div>
      </div></details>
    <details ${credito?"open":""}><summary>Crédito y cuotas</summary>
      <div class="grid2" style="margin-top:10px">
        <div class="field"><label for="f-cuota">Cuota $</label><input id="f-cuota" inputmode="decimal" value="${n("cuota")}"></div>
        <div class="field"><label for="f-ncuotas">Número de cuotas</label><input id="f-ncuotas" inputmode="numeric" value="${n("ncuotas")}"></div>
        <div class="field"><label for="f-frecuencia">Frecuencia</label><select id="f-frecuencia">${opts(FRECUENCIAS,d.frecuencia)}</select></div>
        <div class="field"><label for="f-entrada">Entrada $</label><input id="f-entrada" inputmode="decimal" value="${n("entrada")}"></div>
        <div class="field full"><label for="f-preciofinal">Precio final a crédito $</label><input id="f-preciofinal" inputmode="decimal" value="${n("precio_final")}"></div>
        <div class="field full"><label for="f-plan">Plan o texto de crédito</label><input id="f-plan" value="${v("plan")}"></div>
      </div></details>
    <details ${precios?"open":""}><summary>PVP, precio antes y regalo</summary>
      <div class="grid2" style="margin-top:10px">
        <div class="field"><label for="f-pvplista">PVP de lista $</label><input id="f-pvplista" inputmode="decimal" value="${n("pvp_lista")}"></div>
        <div class="field"><label for="f-antes">Precio antes (tachado) $</label><input id="f-antes" inputmode="decimal" value="${n("antes")}"></div>
        <div class="field full"><label for="f-regalo">Regalo o promo</label><input id="f-regalo" value="${v("regalo")}"></div>
      </div></details>
    ${d.texto?`<details><summary>Ver texto leído</summary><pre>${esc(d.texto)}</pre></details>`:""}
    <button class="btn block" id="save">${ed?"Guardar cambios":"Guardar y seguir"}</button>
    <button class="btn ghost block" id="cancel">${ed?"Volver sin cambios":"Descartar esta foto"}</button>
  </section>`;
}
function itemHTML(c){
  const src=thumbSrc(c);
  const precio=money(c.contado)!=null?fmt(money(c.contado)):(money(c.cuota)!=null?`${fmt(money(c.cuota))}/cuota`:"—");
  const t=typeof c.fecha==="number"?c.fecha:(Date.parse(c.fecha)||Date.now());
  return `<button class="item" data-edit="${esc(c.id)}">${src?`<img class="thumb" src="${esc(src)}" alt="" referrerpolicy="no-referrer">`:`<div class="thumb"></div>`}
    <div style="min-width:0"><div class="t">${esc(c.producto||c.modelo||"Sin nombre")}</div>
      <div class="m">${esc([c.marca,c.modelo].filter(Boolean).join(" · "))}</div>
      <div class="m">${esc([c.competidor,c.agencia,ago(t)].filter(Boolean).join(" · "))}</div></div>
    <div class="pr">${esc(precio)}</div></button>`;
}
function viewMis(){
  if(S.editing){
    const c=S.editing;
    return `<button class="btn ghost small" id="volverMis" style="align-self:flex-start">← Mis capturas</button>`+reviewForm(S.draft||draftDesdeCap(c),{editing:true,thumb:thumbSrc(c),tienda:c.competidor});
  }
  const mias=S.mis.filter(c=>c.autor===S.perfil.nombre);
  let h=`<section class="card"><div class="row" style="justify-content:space-between"><h2>Mis capturas</h2>
      <button class="btn ghost small" id="refrescarMis">Actualizar</button></div>
      <div class="small muted">Toca una captura para revisarla o corregirla. El cambio se guarda en el Sheet.</div>
      ${S.misMsg?`<div class="small muted">${esc(S.misMsg)}</div>`:""}</section>`;
  if(!mias.length)h+=`<div class="empty"><strong>Aún no hay capturas</strong>Toma tu primera foto en la pestaña Capturar.</div>`;
  else h+=`<div class="feed">${mias.slice(0,200).map(itemHTML).join("")}</div>`;
  return h;
}

/* ============ render ============ */
function renderTabs(){
  $("#tabs").innerHTML=[["capturar","Capturar",ICON.cam],["mis","Mis capturas",ICON.list]]
    .map(([k,l,i])=>`<button class="tab" data-tab="${k}" aria-current="${S.tab===k}">${i}<span>${l}</span></button>`).join("");
}
function renderNet(){
  const q=queue().length;
  $("#net").className="net"+(S.online?"":" off");
  $("#who").textContent=(S.perfil?.nombre||"")+(S.agencia&&S.perfil?" · "+S.agencia:"")+(q?` · ${q} por enviar`:"");
}
function render(){
  renderTabs();renderNet();
  $("#app").innerHTML=!S.perfil?viewOnboard():(S.tab==="mis"?viewMis():viewCapture());
}

/* ============ eventos ============ */
$("#app").addEventListener("mousedown",e=>{if(e.target.closest(".combo-ul li[data-val]"))e.preventDefault();});
$("#app").addEventListener("focusin",e=>{
  if(e.target.id&&e.target.id.startsWith("cb-")){const key=e.target.id.slice(3);comboFiltra(key,"");}
});
$("#app").addEventListener("focusout",e=>{
  if(!(e.target.id&&e.target.id.startsWith("cb-")))return;
  const key=e.target.id.slice(3);
  setTimeout(()=>{
    comboCierra(key);
    const inp=$("#cb-"+key);if(!inp)return;
    const k=RKEY(inp.value);
    const hit=COMBOS[key].opts().find(o=>RKEY(o)===k);
    if(hit&&hit!==COMBOS[key].get()){COMBOS[key].set(hit);render();}
    else if(!hit)inp.value=COMBOS[key].get()||"";
  },150);
});
$("#app").addEventListener("input",e=>{
  if(e.target.id&&e.target.id.startsWith("cb-"))comboFiltra(e.target.id.slice(3),e.target.value);
});
$("#app").addEventListener("click",e=>{
  const li=e.target.closest(".combo-ul li[data-val]");
  if(li){
    const key=li.closest(".combo").dataset.combo;
    COMBOS[key].set(li.dataset.val);
    if(key==="agencia")renderNet();
    render();return;
  }
  const t=e.target.closest("button,[data-edit],[data-tienda]");
  if(!t)return;
  if(t.dataset.tienda){S.tienda=t.dataset.tienda;ls.set("ch_tienda",S.tienda);render();return;}
  if(t.dataset.edit){S.editing=S.mis.find(c=>c.id===t.dataset.edit)||null;S.draft=S.editing?draftDesdeCap(S.editing):null;S.faltan=[];render();return;}
  switch(t.id){
    case"entrar":return entrar();
    case"manual":if(!S.agencia){toast("Elige primero la agencia donde estás");return;}return escribirManual();
    case"save":return S.editing?guardarEdicion():guardarCaptura();
    case"cancel":if(S.editing){S.editing=null;render();return;}S.hecha++;return siguiente();
    case"volverMis":S.editing=null;render();return;
    case"refrescarMis":return cargarMis();
  }
});
$("#app").addEventListener("change",e=>{
  const id=e.target.id;
  if(["f-catc","f-linea","f-grupo"].includes(id)){
    const nx={...S.draft,...readForm()};
    if(id==="f-catc"){nx.linea="";nx.grupo="";}
    if(id==="f-linea"){nx.grupo="";}
    nx.sub_grupo="";
    if(id!=="f-grupo")nx.capacidad="";
    S.draft=nx;S.faltan=[];render();return;
  }
  if(id==="cam"||id==="gal"){
    if(!S.agencia){toast("Elige primero la agencia donde estás");e.target.value="";return;}
    const arr=[...e.target.files];e.target.value="";
    if(arr.length)empezarFotos(arr);
    return;
  }
  if(id==="ag-sel"||id==="ag-txt"){
    S.agencia=e.target.value.trim();ls.set("ch_agencia",S.agencia);renderNet();
    if(S.flow==="review")render();
  }
});
$("#app").addEventListener("input",e=>{if(e.target.id==="ag-txt"){S.agencia=e.target.value.trim();ls.set("ch_agencia",S.agencia);renderNet();}});
$("#tabs").addEventListener("click",e=>{
  const t=e.target.closest("[data-tab]");if(!t)return;
  S.tab=t.dataset.tab;S.editing=null;
  if(S.tab==="mis"){render();cargarMis();return;}
  render();
});
async function entrar(){
  const nombre=$("#ob-nombre").value.trim(),pin=$("#ob-pin").value.trim();
  if(!nombre||!pin){toast("Escribe tu nombre y el PIN");return;}
  S.perfil={nombre,pin};ls.set("ch_perfil",S.perfil);render();
  try{await apiGet("capturas","&n=1");toast(`Hola, ${nombre.split(" ")[0]}`);flushQueue();cargarMis();}
  catch(e){
    if(String(e.message)==="pin"){S.perfil=null;ls.set("ch_perfil",null);toast("El PIN no coincide");render();}
    else toast("Entraste sin señal: se verifica cuando haya conexión");
  }
}
window.addEventListener("online",()=>{S.online=true;renderNet();flushQueue();});
window.addEventListener("offline",()=>{S.online=false;renderNet();});
setInterval(()=>{if(document.visibilityState==="visible")flushQueue();},60000);
renderTabs();render();cargarRepo().then(()=>render());
if(S.perfil){flushQueue();}

</script>
</body>
</html>
