# Prueba el Apps Script desde fuera, igual que el teléfono (POST con foto y PIN).
name: Diagnostico Apps Script
on:
  workflow_dispatch:
    inputs:
      pin:
        description: PIN del equipo
        required: false
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probar lectura con IA
        run: |
          PIN=$(jq -r '.inputs.pin // ""' "$GITHUB_EVENT_PATH"); echo "::add-mask::$PIN"; export PIN
          URL=$(grep -o 'https://script.google.com/macros/s/[^"]*/exec' config.js | head -1)
          echo "=== ping"
          curl -sSL "$URL?action=ping&pin=$PIN"; echo
          python3 - > body.json <<'PY'
          import json,os,base64
          b=base64.b64encode(open('.github/foto-real.jpg','rb').read()).decode()
          print(json.dumps({"action":"leer","pin":os.environ.get("PIN",""),"foto":"data:image/jpeg;base64,"+b,
            "listas":{"categorias":["Televisores","Refrigeración","Lavado"],"tiendas":["Artefacta","Crecos","Orve Hogar","Japón"]}}))
          PY
          echo "=== leer (foto real, $(wc -c < body.json) bytes)"
          time curl -sSL -H 'Content-Type: text/plain;charset=utf-8' --data-binary @body.json "$URL" > resp.txt
          echo "--- bytes: $(wc -c < resp.txt)"
          head -c 3000 resp.txt; echo
